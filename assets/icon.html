<!DOCTYPE html>
<html><head><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1024px;height:1024px;overflow:hidden;background:#fff}
  .frame{
    position:absolute;top:0;left:0;
    width:1024px;height:1024px;border-radius:208px;
    background:#1D1D1F;
    font-family:-apple-system,'SF Pro Display',Inter,sans-serif;
  }
  .mark{
    position:absolute;top:0;left:0;right:0;bottom:0;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:368px;letter-spacing:-16px;
  }
  .dot{
    position:absolute;top:160px;right:160px;
    width:112px;height:112px;border-radius:50%;
    background:#34C759;
    box-shadow:0 0 0 32px #1D1D1F;
  }
</style></head>
<body>
  <div class="frame">
    <div class="mark">TN</div>
    <div class="dot"></div>
  </div>
</body></html>
